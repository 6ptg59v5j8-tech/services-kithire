<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBAVL | Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head><body><main class="admin-shell"><header class="admin-top"><a class="admin-brand" href="/">DBAVL<span>.</span><small style="display:block;font:9px var(--mono);letter-spacing:.1em;color:var(--muted)">EQUIPMENT ADMIN</small></a><a href="/" class="production-back-link">VIEW PUBLIC WEBSITE ↗</a></header><section id="login" class="login-wrap"><p class="section-kicker">PRIVATE AREA</p><h1>Welcome back.</h1><p class="skills-empty">Sign in to manage your hire catalogue.</p><form id="login-form" class="admin-form"><label class="wide">Email<input name="email" type="email" required autocomplete="username"></label><label class="wide">Password<input name="password" type="password" required autocomplete="current-password"></label><button class="solid-button wide">SIGN IN</button></form><p id="login-status" class="admin-status"></p></section><section id="dashboard" class="hidden"><div class="section-heading"><div><span class="section-kicker">CATALOGUE MANAGEMENT</span><h2>Hire equipment<span class="accent">.</span></h2></div><button id="logout" class="text-button">SIGN OUT</button></div><div class="admin-panel"><h3 id="form-title">Add equipment</h3><form id="equipment-form" class="admin-form"><input type="hidden" name="id"><label>Item name<input name="name" required maxlength="140"></label><label>Category<input name="category" maxlength="100" placeholder="Lighting, sound, staging..."></label><label>Hire price<input name="price" maxlength="100" placeholder="e.g. £25 / day"></label><label>URL slug<input name="slug" maxlength="160" placeholder="leave blank to generate"></label><label class="wide">Description<textarea name="description"></textarea></label><label class="wide">Technical specifications<textarea name="specifications"></textarea></label><label class="wide">Image URL<input name="image_url" type="url" placeholder="https://..."></label><label class="wide">Upload image<input name="image_file" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide">Availability<select name="is_available"><option value="1">Available for enquiries</option><option value="0">Unavailable</option></select></label><div class="wide admin-actions"><button class="solid-button" type="submit">SAVE EQUIPMENT</button><button class="text-button" type="button" id="cancel-edit">CLEAR FORM</button></div></form><p id="save-status" class="admin-status"></p></div><div class="section-heading"><div><span class="section-kicker">YOUR INVENTORY</span><h2>Current items<span class="accent">.</span></h2></div></div><div id="equipment-list" class="admin-list"></div></section></main></body></html>
